[project]
name = "lex-ai-bench-es"
version = "0.1.0"
description = "Open benchmark for evaluating LLMs on Spanish-language EU regulation (AI Act, GDPR)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Tu Nombre", email = "tu-email@dominio.com"}]
keywords = ["nlp", "llm", "benchmark", "spanish", "ai-act", "gdpr", "evaluation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Science/Research",
]
dependencies = [
    # Core
    "datasets>=3.0.0",
    "huggingface-hub>=0.26.0",
    "transformers>=4.46.0",
    "accelerate>=1.0.0",
    "torch>=2.4.0",

    # Evaluación
    "lm-eval>=0.4.9",
    "inspect-ai>=0.3.50",

    # LLM-judge y APIs
    "groq>=0.11.0",
    "together>=1.3.0",
    "openai>=1.50.0",

    # Análisis
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "krippendorff>=0.8.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0,<2.0",

    # Utilidades
    "typer>=0.13.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "pydantic>=2.9.0",
    "rich>=13.9.0",

    # Tracking
    "wandb>=0.18.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=4.0.0",
    "nbstripout>=0.7.0",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.2.0",
]
annotation = [
    "argilla>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_act_rgpd_es"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests lentos (usar -m 'not slow' para excluir)",
    "gpu: tests que requieren GPU",
]
